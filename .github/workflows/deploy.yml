name: Deploy Absensi to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/html/absensi
            
            echo "🚀 Starting deployment..."
            
            # Enable maintenance mode
            php artisan down --retry=60 --secret="${{ secrets.DEPLOY_SECRET }}" || true
            
            # Pull latest code
            git stash
            git pull origin main
            
            # Install composer dependencies (if changed)
            if git diff HEAD@{1} --name-only | grep -q "composer.json"; then
              composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
            fi
            
            # Install npm dependencies (if changed)
            if git diff HEAD@{1} --name-only | grep -q "package.json"; then
              npm install
            fi
            
            # Build frontend assets
            npm run build
            
            # Run migrations
            php artisan migrate --force
            
            # Clear and optimize
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            # Set permissions
            sudo chmod -R 775 storage bootstrap/cache
            sudo chmod -R 755 public/build
            sudo chown -R www-data:www-data storage bootstrap/cache public/build
            
            # Restart PHP-FPM
            sudo systemctl restart php8.2-fpm
            
            # Disable maintenance mode
            php artisan up
            
            echo "✅ Deployment completed!"
